<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A polished collection of solitaire card games: Klondike, Spider, FreeCell, and Pyramid." />
  <meta name="theme-color" content="#1a3a2a" />
  <title>Kanam's Solitaires</title>
  <link rel="stylesheet" href="/src/styles/base.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">♠ Kanam's Solitaires ♥</h1>
      </div>
      <div class="header-right">
        <nav class="game-nav" id="game-nav"></nav>
        <div class="mode-selectors" id="game-options"></div>
        <button class="sound-toggle" id="sound-toggle" title="Toggle sound">🔇</button>
      </div>
    </header>
    <main id="game-container"></main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
