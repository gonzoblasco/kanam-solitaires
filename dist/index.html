<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A polished collection of solitaire card games: Klondike, Spider, FreeCell, and Pyramid." />
  <meta name="theme-color" content="#1a3a2a" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.svg" />
  <title>Kanam's Solitaires</title>
  <style>
    /* Critical CSS to prevent layout shift before Vite CSS loads */
    html, body { margin: 0; padding: 0; min-height: 100%; }
    #app { display: flex; flex-direction: column; min-height: 100vh; }
    .app-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 4px; padding: 6px 16px; min-height: 96px; }
    .app-title { font-size: 1.1rem; font-weight: 600; white-space: nowrap; margin: 0; }
    .header-right { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .game-nav { display: flex; gap: 6px; }
    .game-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; min-width: 40px; padding: 6px 14px; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; background: rgba(255,255,255,0.04); color: #a09880; }
    .mode-selectors { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    .mode-group { display: flex; align-items: center; gap: 4px; padding: 2px; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; }
    .mode-btn { display: inline-flex; align-items: center; justify-content: center; min-height: 32px; min-width: 32px; padding: 6px 10px; font-size: 0.75rem; border: none; border-radius: 4px; background: transparent; color: #a09880; }
    .sound-toggle { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 44px; padding: 6px 10px; font-size: 1.1rem; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; background: transparent; color: #e8e0d0; }
    #game-container { flex: 1; display: flex; align-items: flex-start; justify-content: center; height: calc(100vh - 96px); min-height: calc(100vh - 96px); overflow: auto; padding: 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
  </style>
  <script type="module" crossorigin src="./assets/index-Df-SeSPt.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BRmkY71B.css">
</head>
<body>
  <div id="app">
    <a href="#game-container" class="skip-link">Skip to game</a>
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">♠ Kanam's Solitaires ♥</h1>
      </div>
      <div class="header-right">
        <nav class="game-nav" id="game-nav"></nav>
        <div class="mode-selectors" id="game-options"></div>
        <button class="sound-toggle" id="sound-toggle" title="Toggle sound">🔇</button>
      </div>
    </header>
    <main id="game-container" aria-label="Game board"></main>
    <div id="announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
